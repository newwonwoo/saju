name: UI offline dependency cache
on:
  push:
    branches: [codex/8ja-ui-parity]
    paths: [.github/workflows/ui-dependency-cache.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Export linux dependencies for isolated offline visual test
        shell: bash
        run: |
          tar -czf /tmp/ui-node-modules.tgz node_modules
          ls -lh /tmp/ui-node-modules.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: ui-node-modules-linux
          path: /tmp/ui-node-modules.tgz
          retention-days: 2
