name: Integrated offline toolchain
on:
  push:
    branches: [codex/integrated-offline-release]
    paths: [.github/workflows/integration-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Pin source dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --save-exact astronomy-engine@2.1.19 korean-lunar-calendar@0.4.0 --no-audit --no-fund
          mkdir -p /tmp/integration-tools
          tar -czf /tmp/integration-tools/node-modules.tgz node_modules package.json package-lock.json
      - name: Prepare baseline native shell
        run: |
          sdk_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$sdk_bin" --install "platforms;android-36" "build-tools;36.0.0"
          npm run android:sync
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Archive no-private-data tools and shell
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/integration-tools/baseline.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/integration-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" /tmp/integration-tools/
          cpp="$(find "$ANDROID_HOME" -type f -name libc++.so -print -quit)"
          cp "$cpp" /tmp/integration-tools/
          sha256sum /tmp/integration-tools/* > /tmp/integration-tools/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-tools
          path: /tmp/integration-tools/
          retention-days: 7
