name: Export final personal-data-free 1.1.2 source
on:
  push:
    branches: [codex/finish-offline-features-1.1.2]
    paths: [.github/workflows/export-112-source.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Package committed source only
        run: |
          git archive --format=zip -o /tmp/saju-vault-1.1.2-verified-source.zip HEAD
          sha256sum /tmp/saju-vault-1.1.2-verified-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: saju-1.1.2-verified-source
          path: /tmp/saju-vault-1.1.2-verified-source.zip
          retention-days: 14
