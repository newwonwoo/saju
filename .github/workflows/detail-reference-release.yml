name: Detail reference 1.0.3 source verification and Android build
on:
  push:
    branches: [codex/8ja-detail-reference]
    paths: [.github/workflows/detail-reference-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: detail-reference-build
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/8ja-detail-reference
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and apply source-only delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root=pathlib.Path('.delivery')
          if not (root/'detail-ui.1.b64').exists():
              print('Source already applied; rebuilding current branch')
              raise SystemExit(0)
          data=''.join((root/f'detail-ui.{n}.b64').read_text().strip() for n in range(1,5))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='9677af155f16c3e88f712fd6eda9e5bde7c799e99cca28335cbe4db3f46b7ee8', 'Patch hash mismatch'
          expected={'android/app/build.gradle','src/mobile/MobileApp.jsx','src/mobile/ReaderAnalysis.jsx','src/mobile/ReaderTiles.jsx','src/mobile/ReferenceReader.jsx','src/mobile/reader-model.js','src/mobile/reference-reader.css','tests/reader-model.test.mjs'}
          paths={line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert paths==expected, f'Unexpected source paths: {paths}'
          p=pathlib.Path('/tmp/reader.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          for n in range(1,5): (root/f'detail-ui.{n}.b64').unlink()
          print('Verified SHA256 and applied eight allowed source files')
          PY
      - name: JavaScript regressions and both production bundles
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test | tee /tmp/detail-js-tests.log
          npm run build
          npm run build:mobile
      - name: Commit verified source to the requested feature branch only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || test -n "$(git ls-files --others --exclude-standard src/mobile tests)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/mobile/ReaderAnalysis.jsx src/mobile/ReaderTiles.jsx src/mobile/ReferenceReader.jsx src/mobile/reader-model.js src/mobile/reference-reader.css tests/reader-model.test.mjs src/mobile/MobileApp.jsx android/app/build.gradle
            git add -u .delivery
            git diff --cached --stat
            git commit -m 'Implement screenshot-based six-column reader, analysis and luck controls (1.0.3)'
            git push origin HEAD:refs/heads/codex/8ja-detail-reference
          fi
          git rev-parse HEAD | tee /tmp/detail-build-commit.txt
      - name: Android SDK and native regression build
        shell: bash
        run: |
          set -euo pipefail
          sdk_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$sdk_bin" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          npm run android:sync
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Package no-seed APK and verification tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/detail-build
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/detail-build/public-debug.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/detail-build/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" /tmp/detail-build/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" /tmp/detail-build/aapt2
          cpp_lib="$(find "$ANDROID_HOME" -type f -name 'libc++.so' -print -quit)"
          test -n "$cpp_lib"
          cp "$cpp_lib" /tmp/detail-build/libc++.so
          cp /tmp/detail-js-tests.log /tmp/detail-build/
          cp /tmp/detail-build-commit.txt /tmp/detail-build/
          cp -r android/app/build/test-results /tmp/detail-build/
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging /tmp/detail-build/public-debug.apk > /tmp/detail-build/badging.txt
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET,json,hashlib
          suites=[ET.parse(p).getroot() for p in pathlib.Path('android/app/build/test-results').rglob('TEST-*.xml')]
          result={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert result['tests']>=15 and result['errors']==result['failures']==0, result
          print(json.dumps(result))
          pathlib.Path('/tmp/detail-build/native-tests.json').write_text(json.dumps(result,indent=2))
          PY
          sha256sum /tmp/detail-build/* 2>/dev/null | tee /tmp/detail-build/hashes.txt || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: detail-1.0.3-public-build
          path: /tmp/detail-build/
          retention-days: 3
