name: Whole-app offline parity
on:
  push:
    branches: [codex/full-feature-parity]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/full-feature-*'
      - '.github/workflows/full-feature-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-feature-parity
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot exact public source
        run: git archive --format=tar.gz HEAD > /tmp/full-feature-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: full-feature-source
          path: /tmp/full-feature-source.tgz
          retention-days: 3
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run build:mobile
