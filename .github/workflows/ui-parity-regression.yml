name: 8ja UI parity regression

on:
  push:
    branches: [codex/8ja-ui-parity]
    paths:
      - "src/mobile/**"
      - "tests/list-utils.test.mjs"
      - ".github/workflows/ui-parity-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all baseline and new regression tests
        run: npm test
      - name: Build original website unchanged
        run: npm run build
      - name: Build mobile app with empty public seed
        run: npm run build:mobile

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Use Android SDK already installed on Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          command -v sdkmanager
          sdkmanager --version
      - name: Install SDK 36 and build tools
        shell: bash
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install npm modules and sync Capacitor assets
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run android:sync
      - name: Native Android regression and debug build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Archive public no-seed Android APK and signer tooling
        shell: bash
        run: |
          mkdir -p /tmp/8ja-ui-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/8ja-ui-artifacts/public-debug.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" /tmp/8ja-ui-artifacts/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" /tmp/8ja-ui-artifacts/zipalign
          sha256sum /tmp/8ja-ui-artifacts/*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 8ja-ui-build-tools-and-no-seed-apk
          path: /tmp/8ja-ui-artifacts/
          retention-days: 3
